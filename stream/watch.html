<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Watch · Event Pal private stream</title>
<style>
:root{--bg:#0b0b10;--card:#15151f;--line:#2a2a3c;--ink:#ececf3;--mute:#a7a7ba;--acc:#f5b942;--ok:#4cc38a;--bad:#ff7a6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 14px 50px;display:flex;flex-direction:column;gap:14px}
h1{margin:4px 0 0;font-size:24px}.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
input{font:inherit;min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#0f0f16;color:var(--ink)}
button{font:inherit;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#1e1e2b;color:var(--ink);cursor:pointer}
button.go{background:var(--acc);color:#1a1408;border:0;font-weight:700}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vid{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;user-select:none;-webkit-user-select:none}
video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.mark{position:absolute;color:#fff;opacity:.22;font-weight:700;font-size:15px;text-shadow:0 1px 2px #000;transition:top 2s,left 2s;pointer-events:none;white-space:nowrap}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:20px;background:#000a}
.err{color:var(--bad);font-size:14px;min-height:1em}.hide{display:none!important}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c0392b;margin-right:6px}
</style>
</head>
<body>
<main>
  <div><div class="mute">Event Pal · private stream</div><h1 id="title">Loading…</h1><div class="mute" id="sub"></div></div>

  <section class="card" id="joinbox">
    <label>Your name (the streamer sees this)<input id="name" maxlength="40" autocomplete="name"></label>
    <label id="passl" class="hide">Pass code<input id="pass" maxlength="12" autocapitalize="characters" placeholder="From your ticket or the streamer"></label>
    <label id="codel" class="hide">Stream code<input id="code" maxlength="6" inputmode="numeric"></label>
    <div class="err" id="err"></div>
    <div class="row"><button class="go" id="join">Ask to watch</button><button id="pay" disabled title="Coming soon">Pay online (coming soon)</button></div>
  </section>

  <div class="vid hide" id="player">
    <video id="v" playsinline autoplay disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback"></video>
    <div class="mark" id="mark"></div>
    <div class="over" id="over"><b id="otext">Waiting for the streamer to let you in…</b><span class="mute" id="osub"></span></div>
  </div>
  <div class="row hide" id="ctrls"><button id="sound">Turn sound on</button><button id="full">Full screen</button><span class="mute" id="state"></span></div>
  <div class="mute">This stream is private. Please don't record or share it.</div>
</main>
<script type="module">
import { $, esc, signIn, rpc, fn, iceServers, gathered, channel, deviceId, params, TEST } from "./stream.js?v=5";

const P = params(), streamId = P.get("s"); let code = P.get("c") || "", me, info, ch, pc, helloTimer, poll, myName = "";
const show = (t, s = "") => { $("#over").classList.toggle("hide", !t); $("#otext").textContent = t || ""; $("#osub").textContent = s; };

function watermark(label) {
  const m = $("#mark"); m.textContent = label;
  const move = () => { m.style.top = (8 + Math.random() * 78) + "%"; m.style.left = (4 + Math.random() * 60) + "%"; };
  move(); setInterval(move, 7000);
}
document.addEventListener("contextmenu", (e) => { if (e.target.closest(".vid")) e.preventDefault(); });

function attach(stream) {
  const v = $("#v"); v.srcObject = stream; v.muted = true; v.play().catch(() => {});
  show(""); $("#ctrls").classList.remove("hide"); $("#state").innerHTML = '<span class="dot"></span>Live';
}
$("#sound").onclick = () => { const v = $("#v"); v.muted = !v.muted; v.play().catch(() => {}); $("#sound").textContent = v.muted ? "Turn sound on" : "Mute"; };
$("#full").onclick = () => { const el = $("#player"); (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); };

async function direct(m) {
  pc?.close(); pc = new RTCPeerConnection({ iceServers: await iceServers() });
  pc.ontrack = (e) => attach(e.streams[0]);
  pc.onicecandidate = (e) => e.candidate && ch.send({ t: "ice", to: m.from, c: e.candidate });
  pc.onconnectionstatechange = () => { if (pc.connectionState === "failed") { show("Connection lost. Reconnecting…"); hello(); } };
  await pc.setRemoteDescription(m.sdp); await pc.setLocalDescription(await pc.createAnswer());
  ch.send({ t: "answer", to: m.from, sdp: pc.localDescription });
}
async function viaRelay(m) {
  const next = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }], bundlePolicy: "max-bundle" });
  const ms = new MediaStream(); next.ontrack = (e) => { ms.addTrack(e.track); attach(ms); };
  const r = await fn("subscribe", { stream: streamId, publisher: m.publisher, tracks: m.tracks });
  await next.setRemoteDescription(r.offer); await next.setLocalDescription(await next.createAnswer()); await gathered(next);
  await fn("renegotiate", { stream: streamId, sessionId: r.sessionId, answer: { type: "answer", sdp: next.localDescription.sdp } });
  const old = pc; pc = next; setTimeout(() => old?.close(), 3000);
}
async function onMsg(m) {
  if (m.t === "offer") { clearInterval(helloTimer); await direct(m).catch((e) => show("Couldn't connect.", e.message)); }
  else if (m.t === "ice") { await pc?.addIceCandidate(m.c).catch(() => {}); }
  else if (m.t === "relay") { clearInterval(helloTimer); await viaRelay(m).catch((e) => show("Couldn't connect through the relay.", e.message)); }
  else if (m.t === "bye") { ended("The streamer removed you from this stream."); }
  else if (m.t === "end") { ended("The stream has ended. Thanks for watching."); }
}
function hello() { clearInterval(helloTimer); const s = () => ch.send({ t: "hello", to: "host", name: myName }); s(); helloTimer = setInterval(s, 4000); }
function ended(t) { clearInterval(poll); clearInterval(helloTimer); pc?.close(); ch?.close(); $("#v").srcObject = null; $("#ctrls").classList.add("hide"); show(t); }

async function waitIn() {
  show("Waiting for the streamer to let you in…", "Keep this page open.");
  poll = setInterval(async () => {
    let s; try { s = await rpc("stream_my_status", { p_id: streamId }); } catch { return; }
    if (s.stream !== "live") return ended("The stream has ended. Thanks for watching.");
    if (s.status === "removed") return ended("The streamer removed you from this stream.");
    if (s.status === "in" && !ch) {
      show("Connecting…");
      ch = channel(streamId, me, (m) => onMsg(m).catch((e) => { if (TEST) $("#osub").textContent = "debug: " + m.t + ": " + e.message; }));
      try { await ch.ready; hello(); } catch { ch.close(); ch = null; }
    }
  }, 2000);
}

$("#join").onclick = async () => {
  $("#err").textContent = ""; $("#join").disabled = true;
  try {
    myName = $("#name").value.trim(); if (!myName) throw new Error("Type your name.");
    code = code || $("#code").value.trim();
    const pass = $("#pass").value.trim();
    const r = await rpc("stream_join", { p_id: streamId, p_code: code, p_name: myName, p_device: deviceId(), p_pass: pass || null });
    localStorage.setItem("ep-stream-name", myName);
    $("#joinbox").classList.add("hide"); $("#player").classList.remove("hide");
    watermark(`${myName}${pass ? " · " + pass.toUpperCase() : ""} · ${deviceId().slice(0, 4)}`);
    if (r.note) $("#osub").textContent = r.note + ". The streamer needs to let this device in.";
    waitIn();
  } catch (e) { $("#err").textContent = e.message; $("#join").disabled = false; }
};

(async () => {
  if (!streamId) { $("#title").textContent = "This link isn't complete"; $("#joinbox").classList.add("hide"); return; }
  try { me = await signIn(); info = await rpc("stream_info", { p_id: streamId }); } catch (e) { $("#title").textContent = "Couldn't open the stream"; $("#err").textContent = e.message; return; }
  if (!info) { $("#title").textContent = "This stream doesn't exist"; $("#joinbox").classList.add("hide"); return; }
  $("#title").textContent = info.title;
  if (info.status !== "live") { $("#sub").textContent = "This stream has ended."; $("#joinbox").classList.add("hide"); return; }
  $("#sub").textContent = info.access === "free" ? "Free · the streamer lets each person in" : info.access === "paid" ? `Pass needed · EC$${Number(info.price).toFixed(2)}` : `Free if the streamer lets you in, or use a pass (EC$${Number(info.price).toFixed(2)})`;
  $("#passl").classList.toggle("hide", info.access === "free"); $("#codel").classList.toggle("hide", !!code);
  $("#pay").classList.toggle("hide", info.access === "free"); $("#join").textContent = info.access === "paid" ? "Watch with my pass" : "Ask to watch";
  $("#name").value = localStorage.getItem("ep-stream-name") || "";
  // Already joined on this device (e.g. page reloaded)? Pick up where they were.
  try { const s = await rpc("stream_my_status", { p_id: streamId }); if (s.status === "in" || s.status === "waiting") { myName = s.name; $("#joinbox").classList.add("hide"); $("#player").classList.remove("hide"); watermark(`${s.name} · ${deviceId().slice(0, 4)}`); waitIn(); } } catch { /* fine */ }
})();
</script>
</body>
</html>
